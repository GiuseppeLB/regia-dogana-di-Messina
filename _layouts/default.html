<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<a class="salta" href="#contenuto">Vai al contenuto</a>
<header class="testata">
  <a class="marchio" href="{{ '/' | relative_url }}">
    <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/><path d="M13 26V14l7 8 7-8v12" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span>{{ site.title }}</span>
  </a>
  <details class="menu">
    <summary>Indice</summary>
    <nav aria-label="Pagine della mostra">
      <ul>
      {% assign tutte = site.pagine | sort: "ordine" %}
      {% for p in tutte %}<li><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>{% endfor %}
      <li><a href="{{ '/oggetti/' | relative_url }}">Tutti gli oggetti</a></li>
      </ul>
    </nav>
  </details>
</header>
<main id="contenuto">
{{ content }}
</main>
<footer class="piede"><p>{{ site.title }} – {{ site.subtitle }}</p></footer>
</body>
</html>
