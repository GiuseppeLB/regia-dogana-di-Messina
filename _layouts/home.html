---
layout: default
---
<section class="apertura">
<h1>{{ site.title }}</h1>
<p class="sottotitolo">{{ site.subtitle }}</p>
</section>
<div class="testo">{{ content }}</div>
<h2>Percorso della mostra</h2>
<ul class="elenco">
{% assign tutte = site.pagine | sort: "ordine" %}
{% for p in tutte %}<li><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>{% endfor %}
</ul>
